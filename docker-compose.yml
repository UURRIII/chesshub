services:

  mariadb:
    image: mariadb:11
    container_name: chesshub-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - chesshub-db-data:/var/lib/mysql
      - ./database/chesshub_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - chesshub-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: chesshub-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    networks:
      - chesshub-net

volumes:
  chesshub-db-data:

networks:
  chesshub-net:
    driver: bridge
