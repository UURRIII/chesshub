apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: grup4
spec:
  storageClassName: nfs-client
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: grup4
spec:
  replicas: 1
  # Recreate: atura el pod vell abans de crear el nou. Imprescindible perquè
  # dos MariaDB no poden compartir alhora el mateix directori de dades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          # securityContext: no podem usar runAsNonRoot perquè l'entrypoint oficial
          # de MariaDB necessita root per inicialitzar el directori de dades i
          # cedir els privilegis al procés mysqld. Sí podem desactivar
          # l'escalada de privilegis un cop el procés ha arrencat.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chesshub-secrets
                  key: db-root-password
            - name: MYSQL_DATABASE
              value: chesshub
            - name: MYSQL_USER
              value: chesshub
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chesshub-secrets
                  key: db-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 40
            periodSeconds: 20
          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  namespace: grup4
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
