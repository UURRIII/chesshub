apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-server
  namespace: grup4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: socket-server
  template:
    metadata:
      labels:
        app: socket-server
    spec:
      containers:
        - name: socket-server
          image: kube0.lacetania.cat/grup4/chesshub-socket:latest
          ports:
            - containerPort: 3001
          env:
            - name: SOCKET_PORT
              value: "3001"
            - name: FRONTEND_URL
              value: "http://grup4.infla.cat"
            - name: ALLOWED_ORIGINS
              value: "http://grup4.infla.cat"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chesshub-secrets
                  key: jwt-secret
            # Variables de BD: el socket consulta friendships (areFriends) i
            # users.is_active (isUserActive) per validar DMs i expulsar comptes
            # desactivats. Sense elles, aquestes comprovacions de seguretat
            # fallen i recorren al comportament per defecte (fail-open).
            - name: DB_HOSTNAME
              value: mariadb-service
            - name: DB_DATABASE
              value: chesshub
            - name: DB_USERNAME
              value: chesshub
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chesshub-secrets
                  key: db-password
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: socket-service
  namespace: grup4
spec:
  selector:
    app: socket-server
  ports:
    - port: 3001
      targetPort: 3001
