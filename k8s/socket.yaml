apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-server
  namespace: grup4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: socket-server
  template:
    metadata:
      labels:
        app: socket-server
    spec:
      containers:
        - name: socket-server
          image: infla.cat:2270/grup4/chesshub-socket:latest
          ports:
            - containerPort: 3001
          env:
            - name: SOCKET_PORT
              value: "3001"
            - name: FRONTEND_URL
              value: "http://grup4.infla.cat"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: socket-service
  namespace: grup4
spec:
  selector:
    app: socket-server
  ports:
    - port: 3001
      targetPort: 3001
